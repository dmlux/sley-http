name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test on Java 25
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Set up Java 21 for compatibility tests
        id: java21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Check formatting and run tests
        run: sbt --batch "scalafmtCheckAll; scalafmtSbtCheck; testOnly *"

      - name: Run tests on Java 21
        env:
          TEST_JAVA_HOME: ${{ steps.java21.outputs.path }}
        run: >-
          sbt --batch
          'set Test / fork := true;
          set Test / javaHome := Some(file(sys.env("TEST_JAVA_HOME")));
          testOnly *'
